name: Update contribution snake

on:
  schedule:
    - cron: "0 6 * * *" # todos los días, 00:00 hora de México
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake.svg?color_snake=#7A5CFF&color_dots=#ebedf0,#d6ccff,#b09bff,#8a6bff,#5400F7
            profile/snake-dark.svg?palette=github-dark&color_snake=#7A5CFF&color_dots=#161b22,#2d1b69,#4c2bb3,#6a3df0,#9f7aea

      - name: Commit animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update contribution snake" || exit 0
          git push
